services:
  stockflow-db:
    image: postgres:16-alpine
    container_name: stockflow-db
    environment:
      POSTGRES_DB: stockflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5434:5432"
    volumes:
      - stockflow_data:/var/lib/postgresql/data

  stockflow-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockflow-api
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=stockflow-db;Database=stockflow_db;Username=postgres;Password=postgrespassword
    depends_on:
      - stockflow-db

volumes:
  stockflow_data: